name: PRA4KA 2.0 checks

on:
  push:
    branches: [ "pra4ka-2.0" ]
  workflow_dispatch:

jobs:
  sqlite-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run PRA4KA 2.0 tests
        env:
          BOT_TOKEN: "123456:TESTTOKEN"
        run: python -m unittest -v tests.test_pra4ka2
      - name: Import core modules
        env:
          BOT_TOKEN: "123456:TESTTOKEN"
        run: |
          python - <<'PY'
          import database
          import keyboards
          import booking_service
          import waitlist_service
          import handlers.pra4ka2
          print("imports ok")
          PY

  postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pra4ka
          POSTGRES_PASSWORD: pra4ka
          POSTGRES_DB: pra4ka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pra4ka -d pra4ka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Initialize PostgreSQL schema
        env:
          DATABASE_URL: postgresql://pra4ka:pra4ka@127.0.0.1:5432/pra4ka
          BOT_TOKEN: "123456:TESTTOKEN"
        run: |
          python - <<'PY'
          import database
          database.init_db()
          database.add_machine("wash", "Стиральная №1")
          database.add_machine("dry", "Сушилка №2")
          database.save_user(1001, "Иванов", "101")
          database.save_user(1002, "Петров", "102")
          import waitlist_service as wl
          import booking_service as bs
          import asyncio
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from config import TIMEZONE

          m1 = database.get_machine_id_by_name("Стиральная №1")
          rid = wl.save_request(1001, [(18, 23)], [m1], False, "auto")
          assert rid
          future = (datetime.now(ZoneInfo(TIMEZONE)).date() + timedelta(days=1)).isoformat()
          result = asyncio.run(bs.create_booking_safe(database.get_user(1001)[0], m1, future, 18))
          assert result.booking_id
          assert not wl.get_active_request_for_tg(1001)
          print("postgres functional checks ok")
          PY
